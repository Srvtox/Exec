name: Check V2Ray Configs

on:
  workflow_dispatch:
    inputs:
      subscription_url:
        description: "V2Ray subscription URL"
        required: true
        type: string

jobs:
  check-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check configs from subscription
        env:
          SUBSCRIPTION_URL: ${{ github.event.inputs.subscription_url }}
        run: |
          python << 'PY'
          import os
          import re
          import json
          import base64
          import socket
          import urllib.request
          import urllib.parse

          SUBSCRIPTION_URL = os.environ["SUBSCRIPTION_URL"]
          TIMEOUT = 5

          def safe_b64decode(data: str) -> bytes:
              data = data.strip()
              padding = len(data) % 4
              if padding:
                  data += "=" * (4 - padding)
              return base64.urlsafe_b64decode(data)

          def fetch_subscription(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return resp.read().decode("utf-8", errors="ignore").strip()

          def try_decode_subscription(text):
              # بعضی subscriptionها base64 هستند، بعضی نه
              try:
                  decoded = safe_b64decode(text).decode("utf-8", errors="ignore")
                  if "vmess://" in decoded or "vless://" in decoded or "trojan://" in decoded or "ss://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          def parse_vmess(link):
              raw = link[len("vmess://"):].strip()
              data = safe_b64decode(raw).decode("utf-8", errors="ignore")
              obj = json.loads(data)
              host = obj.get("add")
              port = int(obj.get("port"))
              return host, port

          def parse_vless(link):
              parsed = urllib.parse.urlparse(link)
              host = parsed.hostname
              port = parsed.port
              return host, port

          def parse_trojan(link):
              parsed = urllib.parse.urlparse(link)
              host = parsed.hostname
              port = parsed.port
              return host, port

          def parse_ss(link):
              raw = link[len("ss://"):]
              if "#" in raw:
                  raw = raw.split("#", 1)[0]

              if "@" in raw:
                  # فرمت جدید
                  parsed = urllib.parse.urlparse("ss://" + raw)
                  return parsed.hostname, parsed.port
              else:
                  # فرمت base64 قدیمی
                  decoded = safe_b64decode(raw).decode("utf-8", errors="ignore")
                  # method:password@host:port
                  m = re.search(r'@([^:]+):(\d+)', decoded)
                  if not m:
                      raise ValueError("Invalid SS config")
                  return m.group(1), int(m.group(2))

          def extract_host_port(link):
              if link.startswith("vmess://"):
                  return parse_vmess(link)
              elif link.startswith("vless://"):
                  return parse_vless(link)
              elif link.startswith("trojan://"):
                  return parse_trojan(link)
              elif link.startswith("ss://"):
                  return parse_ss(link)
              else:
                  raise ValueError("Unsupported protocol")

          def test_tcp(host, port, timeout=TIMEOUT):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return True
              except Exception:
                  return False

          content = fetch_subscription(SUBSCRIPTION_URL)
          content = try_decode_subscription(content)

          lines = [line.strip() for line in content.splitlines() if line.strip()]
          supported = []
          active = []

          for line in lines:
              if line.startswith(("vmess://", "vless://", "trojan://", "ss://")):
                  supported.append(line)

          print(f"Total supported configs found: {len(supported)}")

          for cfg in supported:
              try:
                  host, port = extract_host_port(cfg)
                  ok = test_tcp(host, port)
                  status = "ACTIVE" if ok else "INACTIVE"
                  print(f"[{status}] {host}:{port}")
                  if ok:
                      active.append(cfg)
              except Exception as e:
                  print(f"[ERROR] Could not parse/test config: {cfg[:80]}... -> {e}")

          with open("active_configs.txt", "w", encoding="utf-8") as f:
              for item in active:
                  f.write(item + "\n")

          print("\n=== ACTIVE CONFIGS ===")
          for item in active:
              print(item)

          print(f"\nSaved {len(active)} active configs to active_configs.txt")
          PY

      - name: Upload active configs artifact
        uses: actions/upload-artifact@v4
        with:
          name: active-configs
          path: active_configs.txt
