name: Pro Download and Release

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL of the file (Direct link, SourceForge, or Magnet)"
        required: true
        type: string
      release_tag:
        description: "Custom release tag"
        default: "v1.0"
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    # این بخش برای اینه که گیت‌هاب اجازه داشته باشه فایل رو آپلود کنه
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Prepare Download Directory
        run: mkdir -p downloads
      - name: Install WGCF
        run: |
          wget -q https://github.com/ViRb3/wgcf/releases/latest/download/wgcf_2.2.31_linux_amd64 -O wgcf
          chmod +x wgcf
          sudo mv wgcf /usr/local/bin/

          wgcf register --accept-tos
          wgcf generate

      # ==========================================
      # Install WireProxy
      # ==========================================
      - name: Install WireProxy
        run: |
          wget -q https://github.com/pufferffish/wireproxy/releases/latest/download/wireproxy_linux_amd64.tar.gz -O wireproxy.tar.gz
          
          tar -xzf wireproxy.tar.gz
          
          chmod +x wireproxy
          sudo mv wireproxy /usr/local/bin/

          wireproxy --version || echo "WireProxy installed!"
      # ==========================================
      # Start WARP Proxy
      # ==========================================
      - name: Start WARP
        run: |
          mkdir -p warp

          cat > warp/config.ini << EOF
          [Interface]
          PrivateKey = $(grep PrivateKey wgcf-profile.conf | awk '{print $3}')
          Address = 172.16.0.2/32
          DNS = 1.1.1.1
          MTU = 1280

          [Peer]
          PublicKey = $(grep PublicKey wgcf-profile.conf | awk '{print $3}')
          Endpoint = $(grep Endpoint wgcf-profile.conf | awk '{print $3}')
          AllowedIPs = 0.0.0.0/0

          [Socks5]
          BindAddress = 127.0.0.1:1080
          EOF

          nohup wireproxy -c warp/config.ini &

          sleep 6

          echo "Testing WARP IP:"
          curl --socks5 127.0.0.1:1080 https://ipinfo.io


      - name: Mega Download
        run: |
          cd downloads
          # استفاده از aria2c برای همه نوع لینکی (HTTP, Torrent, Magnet)
          # این ابزار هوشمندانه اسم فایل رو از هدرهای سایت استخراج می‌کنه
          aria2c --continue=true \
                 --max-connection-per-server=16 \
                 --split=16 \
                 --remote-time=true \
                 --summary-interval=15 \
                 "${{ github.event.inputs.file_url }}"
          
          echo "ببینیم چی دانلود شده:"
          ls -lh

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}-${{ github.run_id }}
          name: "Release ${{ github.event.inputs.release_tag }} (Build ${{ github.run_number }})"
          # اینجا میگیم هر چی توی پوشه دانلود هست رو بردار و آپلود کن
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
