name: Pro Download and Release

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: "URL of the file (Direct link, SourceForge, or Magnet)"
        required: true
        type: string
      release_tag:
        description: "Custom release tag"
        default: "v1.0"
        type: string

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl wget tar

      - name: Prepare Download Directory
        run: mkdir -p downloads

      - name: Install WGCF
        run: |
          wget -q https://github.com/ViRb3/wgcf/releases/latest/download/wgcf_2.2.31_linux_amd64 -O wgcf
          chmod +x wgcf
          sudo mv wgcf /usr/local/bin/wgcf

          wgcf register --accept-tos
          wgcf generate

      - name: Install WireProxy
        run: |
          wget -q https://github.com/pufferffish/wireproxy/releases/latest/download/wireproxy_linux_amd64.tar.gz -O wireproxy.tar.gz
          tar -xzf wireproxy.tar.gz
          chmod +x wireproxy
          sudo mv wireproxy /usr/local/bin/wireproxy

          wireproxy --version || true

      - name: Start WARP SOCKS5 Proxy
        run: |
          mkdir -p warp

          PRIVATE_KEY=$(grep PrivateKey wgcf-profile.conf | awk '{print $3}')
          PUBLIC_KEY=$(grep PublicKey wgcf-profile.conf | awk '{print $3}')
          ENDPOINT=$(grep Endpoint wgcf-profile.conf | awk '{print $3}')

          cat > warp/config.ini << EOF
          [Interface]
          PrivateKey = ${PRIVATE_KEY}
          Address = 172.16.0.2/32
          DNS = 1.1.1.1
          MTU = 1280

          [Peer]
          PublicKey = ${PUBLIC_KEY}
          Endpoint = ${ENDPOINT}
          AllowedIPs = 0.0.0.0/0

          [Socks5]
          BindAddress = 127.0.0.1:1080
          EOF

          nohup wireproxy -c warp/config.ini > warp/wireproxy.log 2>&1 &
          sleep 8

          echo "=== WireProxy log ==="
          cat warp/wireproxy.log || true

          echo "=== Testing WARP IP ==="
          curl --socks5-hostname 127.0.0.1:1080 https://ipinfo.io || true
      - name: Install Privoxy
        run: |
          sudo apt-get update
          sudo apt-get install -y privoxy

      - name: Configure Privoxy
        run: |
          echo 'listen-address  127.0.0.1:8118' | sudo tee /etc/privoxy/config
          echo 'forward-socks5t   /   127.0.0.1:1080 .' | sudo tee -a /etc/privoxy/config
          sudo systemctl restart privoxy
          sleep 3

      - name: Test HTTP proxy over WARP
        run: |
          curl -x http://127.0.0.1:8118 https://ipinfo.io


      - name: Download file via WARP using curl
        run: |
          cd downloads
          URL="${{ github.event.inputs.file_url }}"

          echo "Downloading: $URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --proxy http://127.0.0.1:8118 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Upgrade-Insecure-Requests: 1" \
            -e "https://sourceforge.net/" \
            -OJ "$URL"

          echo "=== Downloaded files ==="
          ls -lh


      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}-${{ github.run_id }}
          name: "Release ${{ github.event.inputs.release_tag }} (Build ${{ github.run_number }})"
          files: downloads/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
